server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/elshinta_chat?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: INFO

app:
  jwt-secret: ${JWT_SECRET:change-this-local-development-secret-change-this}
  jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  internal-access-code: ${INTERNAL_ACCESS_CODE:ELSHINTA-INTERNAL-2026}
  upload-dir: ${UPLOAD_DIR:media}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
